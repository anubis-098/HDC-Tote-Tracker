name: hdc-tote-tests
services:
  tests:
    build:
      context: ./backend
      dockerfile: Dockerfile.test
    environment:
      APP_DB_PASSWORD: test-app-only
      IMAGE_DB_PASSWORD: test-images-only
    depends_on:
      postgres-app: {condition: service_healthy}
      postgres-images: {condition: service_healthy}
  postgres-app:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tote_app
      POSTGRES_USER: tote
      POSTGRES_PASSWORD: test-app-only
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tote -d tote_app"]
      interval: 2s
      retries: 30
  postgres-images:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: tote_images
      POSTGRES_USER: images
      POSTGRES_PASSWORD: test-images-only
    tmpfs: [/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U images -d tote_images"]
      interval: 2s
      retries: 30
