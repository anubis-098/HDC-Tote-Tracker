map $uri $response_cache_control {
  default "no-cache";
  ~^/api/ "no-store";
  ~^/assets/ "public, max-age=31536000, immutable";
}
server {
  listen 80;
  root /usr/share/nginx/html;
  index index.html;
  client_max_body_size 9m;
  add_header X-Content-Type-Options nosniff always;
  add_header X-Frame-Options DENY always;
  add_header Referrer-Policy same-origin always;
  add_header Cache-Control $response_cache_control always;
  add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data:; connect-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;
  location = /healthz { access_log off; return 204; }
  location /api/ {
    proxy_pass http://api:8000;
    proxy_set_header Host $http_host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 300s;
    proxy_hide_header Cache-Control;
  }
  location /assets/ { try_files $uri =404; }
  location / { try_files $uri $uri/ /index.html; }
}
