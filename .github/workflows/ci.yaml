name: Build and verify
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      APP_DB_PASSWORD: ci-app-ephemeral-only
      IMAGE_DB_PASSWORD: ci-images-ephemeral-only
      APP_DATA_PATH: /tmp/hdc-tote-ci-app
      IMAGE_DATA_PATH: /tmp/hdc-tote-ci-images
      COOKIE_SECURE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend install, audit and build
        working-directory: frontend
        run: |
          npm ci
          npm audit --audit-level=high
          npm run build
      - name: PostgreSQL integration tests
        run: docker compose -f compose.test.yaml up --build --abort-on-container-exit --exit-code-from tests
      - name: Runtime dependency audit
        run: docker run --rm --entrypoint sh hdc-tote-tests-tests -c 'pip install --quiet pip-audit && pip-audit -r requirements.lock'
      - name: Start isolated web stack
        run: |
          mkdir -p "$APP_DATA_PATH" "$IMAGE_DATA_PATH"
          docker compose up --build -d --wait --wait-timeout 180
      - name: Install browser
        working-directory: frontend
        run: npx playwright install --with-deps chromium
      - name: Handheld UI tests
        working-directory: frontend
        env:
          PLAYWRIGHT_CHANNEL: chromium
        run: npm run test:ui
      - name: Save failure screenshots
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: handheld-test-results
          path: frontend/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Logs and cleanup
        if: always()
        run: |
          docker compose logs --tail 60 api frontend
          docker compose down
          docker compose -f compose.test.yaml down
